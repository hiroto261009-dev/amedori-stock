name: Check Stock

on:
  workflow_dispatch:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: ファイルを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要なものをインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: stock.pyを探す
        run: |
          echo "=== 現在の場所 ==="
          pwd
          echo "=== stock.pyを探します ==="
          find . -type f -name "stock.py" -print

      - name: 在庫チェック
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          STOCK_FILE=$(find . -type f -name "stock.py" | head -n 1)

          if [ -z "$STOCK_FILE" ]; then
            echo "ERROR: stock.py が見つかりません"
            exit 1
          fi

          echo "実行するファイル: $STOCK_FILE"
          python "$STOCK_FILE"
